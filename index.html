<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Thi Trắc Nghiệm</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 22px 5%;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; opacity: .9; }

    .container {
      max-width: 1050px;
      margin: 28px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr 240px;
      gap: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0000000a;
    }

    .tag {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    h2 { font-size: 21px; line-height: 1.5; }

    .option {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid #dbe3ee;
      padding: 14px;
      border-radius: 10px;
      margin: 10px 0;
      cursor: pointer;
      line-height: 1.5;
    }

    .option:hover { background: #eff6ff; }
    .option input { margin-top: 4px; }

    .statement {
      border-bottom: 1px solid #e2e8f0;
      padding: 15px 0;
    }

    .statement p { line-height: 1.6; margin-top: 0; }

    select {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    button:disabled { opacity: .4; cursor: not-allowed; }

    .primary { background: #2563eb; color: white; }
    .secondary { background: #e2e8f0; color: #1e293b; }
    .submit { background: #16a34a; color: white; width: 100%; }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 24px;
    }

    .question-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 16px 0;
    }

    .q-number {
      background: #e2e8f0;
      color: #334155;
      padding: 10px 0;
    }

    .q-number.active { background: #2563eb; color: white; }
    .q-number.done:not(.active) { background: #bbf7d0; }

    .muted { color: #64748b; font-size: 14px; line-height: 1.6; }
    #result { margin-top: 20px; line-height: 1.8; }


    .tf-table-wrap { overflow-x: auto; margin-top: 18px; }
    .tf-table { width: 100%; border-collapse: collapse; min-width: 420px; }
    .tf-table th, .tf-table td { border: 1px solid #dbe3ee; padding: 12px; }
    .tf-table thead th { background: #eff6ff; color: #1e40af; text-align: center; }
    .tf-table th:first-child, .tf-table td:first-child { text-align: left; }
    .tf-table td.choice { width: 76px; text-align: center; }
    .tf-table input[type="radio"] { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; }
    .tf-table tr:last-child td { border-bottom: 1px solid #dbe3ee; }
    .round-info { margin: 12px 0; padding: 12px 14px; background: #eff6ff; border-radius: 10px; color: #1e40af; line-height: 1.5; }
    .review-item { padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
    .correct-text { color: #15803d; font-weight: bold; }
    .wrong-text { color: #dc2626; font-weight: bold; }
    .retry-button { background: #7c3aed; color: white; margin-top: 12px; }
    .tf-table tr:hover { background: #f8fafc; }

    @media (max-width: 700px) {
      .container { grid-template-columns: 1fr; }
      header { padding: 20px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>🎓 Web Thi Trắc Nghiệm</h1>
    <p>Luyện tập kiến thức · Chọn đáp án · Kiểm tra kết quả</p>
  </header>

  <main class="container">
    <section class="card">
      <div id="question-area"></div>

      <div class="nav-buttons">
        <button class="secondary" id="prev">← Câu trước</button>
        <button class="primary" id="next">Câu tiếp →</button>
      </div>

      <div id="result" hidden></div>
    </section>

    <aside class="card">
      <h3>Bài làm của bạn</h3>
      <p class="muted" id="progress">Đã làm 0/2 câu</p>

      <div class="question-grid" id="question-grid"></div>

      <p class="muted">
        <span style="color:#16a34a">■</span> Đã trả lời<br>
        <span style="color:#2563eb">■</span> Câu đang xem<br>
        <span style="color:#94a3b8">■</span> Chưa trả lời
      </p>

      <button class="submit" id="submit">Nộp bài</button>
      <p class="muted">Sau khi nộp bài, ông có thể luyện lại câu/ý sai tối đa 3 lần.</p>
    </aside>
  </main>

  <script>
    let questions = [];
    let current = 0;
    let submitted = false;
    let answers = [];
    let round = 1;

    // Mỗi phần tử là một câu MCQ hoặc một nhóm nhận định Đúng/Sai.
    // Ở lượt 2 và 3, nhóm Đúng/Sai chỉ chứa những nhận định còn sai.
    let roundItems = [];
    let lastMisses = [];

    const area = document.getElementById("question-area");
    const grid = document.getElementById("question-grid");
    const progress = document.getElementById("progress");
    const result = document.getElementById("result");

    async function loadQuestions() {
      try {
        const response = await fetch("./questions.json");
        if (!response.ok) throw new Error("Không tìm thấy questions.json");

        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error("File đề chưa có câu hỏi hợp lệ");
        }

        questions = data;
        roundItems = questions.map((q, qi) => ({
          qi,
          statements: q.type === "tf" ? q.statements.map((_, si) => si) : null
        }));
        resetAnswers();
        render();
      } catch (error) {
        area.textContent = "Không tải được đề thi: " + error.message +
          ". Hãy kiểm tra file questions.json và chạy bằng Live Server.";
      }
    }

    function resetAnswers() {
      answers = questions.map(q =>
        q.type === "mcq" ? null : Array(q.answer.length).fill(null)
      );
      current = 0;
      submitted = false;
      result.hidden = true;
      result.innerHTML = "";
      document.getElementById("submit").disabled = false;
    }

    function getCurrentItem() {
      return roundItems[current];
    }

    function isAnswered(item) {
      const q = questions[item.qi];
      if (q.type === "mcq") return answers[item.qi] !== null;
      return item.statements.every(si => answers[item.qi][si] !== null);
    }

    function render() {
      if (!roundItems.length) {
        area.textContent = "Không còn câu hỏi cần làm. Chúc mừng ông!";
        return;
      }

      const item = getCurrentItem();
      const q = questions[item.qi];
      area.innerHTML = "";

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = q.type === "mcq"
        ? "TRẮC NGHIỆM A/B/C/D"
        : "TRẮC NGHIỆM ĐÚNG / SAI";

      const roundInfo = document.createElement("div");
      roundInfo.className = "round-info";
      roundInfo.textContent = round === 1
        ? "Lần 1 · Làm toàn bộ đề"
        : `Lần ${round} · Chỉ luyện lại những câu/ý còn sai ở lần trước`;

      const count = document.createElement("p");
      count.className = "muted";
      count.textContent = `Câu ${current + 1} / ${roundItems.length}` +
        (q.topic ? ` · ${q.topic}` : "");

      const title = document.createElement("h2");
      title.textContent = q.title;

      area.append(tag, roundInfo, count, title);

      if (q.type === "mcq") {
        q.options.forEach((option, i) => {
          const label = document.createElement("label");
          label.className = "option";

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "mcq";
          radio.checked = answers[item.qi] === i;
          radio.disabled = submitted;
          radio.addEventListener("change", () => {
            answers[item.qi] = i;
            updateGrid();
          });

          label.append(radio, document.createTextNode(option));
          area.appendChild(label);
        });
      } else {
        const intro = document.createElement("p");
        intro.className = "muted";
        intro.textContent = "Đọc từng nhận định và chọn một ô Đúng hoặc Sai.";
        area.appendChild(intro);

        const wrap = document.createElement("div");
        wrap.className = "tf-table-wrap";

        const table = document.createElement("table");
        table.className = "tf-table";
        table.innerHTML = `
          <thead>
            <tr>
              <th>Nhận định</th>
              <th>Đúng</th>
              <th>Sai</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector("tbody");

        item.statements.forEach(si => {
          const tr = document.createElement("tr");
          const statementCell = document.createElement("td");
          statementCell.textContent =
            String.fromCharCode(97 + si) + ") " + q.statements[si];

          const trueCell = document.createElement("td");
          trueCell.className = "choice";
          const falseCell = document.createElement("td");
          falseCell.className = "choice";

          const trueRadio = document.createElement("input");
          trueRadio.type = "radio";
          trueRadio.name = `tf-${item.qi}-${si}`;
          trueRadio.setAttribute("aria-label", "Đúng");
          trueRadio.checked = answers[item.qi][si] === true;
          trueRadio.disabled = submitted;
          trueRadio.addEventListener("change", () => {
            answers[item.qi][si] = true;
            updateGrid();
          });

          const falseRadio = document.createElement("input");
          falseRadio.type = "radio";
          falseRadio.name = `tf-${item.qi}-${si}`;
          falseRadio.setAttribute("aria-label", "Sai");
          falseRadio.checked = answers[item.qi][si] === false;
          falseRadio.disabled = submitted;
          falseRadio.addEventListener("change", () => {
            answers[item.qi][si] = false;
            updateGrid();
          });

          trueCell.appendChild(trueRadio);
          falseCell.appendChild(falseRadio);
          tr.append(statementCell, trueCell, falseCell);
          tbody.appendChild(tr);
        });

        wrap.appendChild(table);
        area.appendChild(wrap);
      }

      document.getElementById("prev").disabled = current === 0;
      document.getElementById("next").disabled =
        current === roundItems.length - 1 || submitted;
      updateGrid();
    }

    function updateGrid() {
      grid.innerHTML = "";
      roundItems.forEach((item, i) => {
        const button = document.createElement("button");
        button.className = "q-number";
        button.textContent = i + 1;
        if (i === current) button.classList.add("active");
        if (isAnswered(item)) button.classList.add("done");

        button.addEventListener("click", () => {
          current = i;
          render();
        });
        grid.appendChild(button);
      });

      const count = roundItems.filter(isAnswered).length;
      progress.textContent = `Đã làm ${count}/${roundItems.length} câu`;
    }

    function gradeRound() {
      let score = 0;
      let maxScore = 0;
      const misses = [];

      roundItems.forEach(item => {
        const q = questions[item.qi];
        if (q.type === "mcq") {
          maxScore++;
          if (answers[item.qi] === q.answer) score++;
          else misses.push({ qi: item.qi, si: null });
        } else {
          item.statements.forEach(si => {
            maxScore++;
            if (answers[item.qi][si] === q.answer[si]) score++;
            else misses.push({ qi: item.qi, si });
          });
        }
      });

      return { score, maxScore, misses };
    }

    function showResults(grade) {
      result.hidden = false;
      result.innerHTML = "";

      const heading = document.createElement("h2");
      heading.textContent = `🎉 Kết quả lần ${round}`;
      const scoreLine = document.createElement("p");
      scoreLine.innerHTML = `Số ý/câu đúng: <strong>${grade.score}/${grade.maxScore}</strong>`;
      const percentLine = document.createElement("p");
      percentLine.innerHTML = `Điểm quy đổi thang 10: <strong>${(grade.score / grade.maxScore * 10).toFixed(2)}</strong>`;
      result.append(heading, scoreLine, percentLine);

      const reviewTitle = document.createElement("h3");
      reviewTitle.textContent = grade.misses.length
        ? "Những câu/ý cần xem lại"
        : "Xuất sắc! Ông đã đúng tất cả.";
      result.appendChild(reviewTitle);

      if (grade.misses.length) {
        grade.misses.forEach(miss => {
          const q = questions[miss.qi];
          const line = document.createElement("div");
          line.className = "review-item";

          if (miss.si === null) {
            const correct = q.options[q.answer];
            line.textContent = `Câu ${q.number ?? miss.qi + 1}: ${q.title} · Đáp án đúng: ${correct}`;
          } else {
            const correct = q.answer[miss.si] ? "Đúng" : "Sai";
            line.textContent = `Câu ${q.number ?? miss.qi + 1}, ý ${String.fromCharCode(97 + miss.si)}: Đáp án đúng là ${correct}.`;
          }
          result.appendChild(line);
        });
      }

      if (grade.misses.length && round < 3) {
        const retry = document.createElement("button");
        retry.className = "retry-button";
        retry.textContent = `Làm lại ${grade.misses.length} câu/ý sai (lần ${round + 1})`;
        retry.addEventListener("click", startNextRound);
        result.appendChild(retry);
      } else if (grade.misses.length && round === 3) {
        const note = document.createElement("p");
        note.className = "muted";
        note.textContent = "Đã hoàn thành 3 lần. Ông có thể xem lại đáp án đúng ở phía trên.";
        result.appendChild(note);
      } else {
        const note = document.createElement("p");
        note.className = "correct-text";
        note.textContent = "Không còn câu sai để luyện lại!";
        result.appendChild(note);
      }

      result.scrollIntoView({ behavior: "smooth" });
    }

    function startNextRound() {
      const grouped = new Map();
      lastMisses.forEach(({ qi, si }) => {
        if (!grouped.has(qi)) grouped.set(qi, []);
        if (si !== null) grouped.get(qi).push(si);
      });

      roundItems = Array.from(grouped.entries()).map(([qi, statementIndexes]) => ({
        qi,
        statements: questions[qi].type === "tf" ? statementIndexes : null
      }));

      round++;
      resetAnswers();
      render();
      area.scrollIntoView({ behavior: "smooth" });
    }

    document.getElementById("prev").addEventListener("click", () => {
      if (current > 0 && !submitted) {
        current--;
        render();
      }
    });

    document.getElementById("next").addEventListener("click", () => {
      if (current < roundItems.length - 1 && !submitted) {
        current++;
        render();
      }
    });

    document.getElementById("submit").addEventListener("click", () => {
      if (submitted) return;
      if (!confirm("Bạn có chắc muốn nộp bài không?")) return;

      const grade = gradeRound();
      lastMisses = grade.misses;
      submitted = true;
      render();
      showResults(grade);
      document.getElementById("submit").disabled = true;
    });

    loadQuestions();
  </script>
</body>
</html>
